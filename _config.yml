# Used only while the GitHub Pages source is "Deploy from a branch", which builds the
# repository root with Jekyll. Keeps that build to the same public files as the dist/
# artifact. See DEPLOYMENT.md for switching the source to GitHub Actions.
exclude:
  - README.md
  - DEPLOYMENT.md
  - MEASUREMENT.md
  - BRAND_ASSETS.md
  - Caddyfile
  - package.json
  - package-lock.json
  - server.mjs
  - tailwind.config.cjs
  - scripts
  - assets/tailwind.css
  - assets/fonts/LICENSE.md
  - internal
  - dist
  - node_modules
