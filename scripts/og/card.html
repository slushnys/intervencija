<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Social card</title>
  <link rel="stylesheet" href="/assets/theme.css">
  <style>
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #20231f; }
    .card { box-sizing: border-box; display: flex; flex-direction: column; width: 1200px; height: 630px; padding: 64px 72px 56px; color: #f5f5ec; }
    .brand { display: flex; align-items: center; gap: 16px; font: 600 34px/1 var(--serif); letter-spacing: -.045em; color: #f5f5ec; }
    .mark { display: grid; place-items: center; width: 44px; height: 44px; border: 2px solid currentColor; }
    .mark::after { content: ""; width: 12px; height: 12px; background: currentColor; }
    .eyebrow { margin-top: 68px; font: 600 18px/1.4 var(--sans); letter-spacing: .16em; text-transform: uppercase; color: #aebc93; }
    h1 { margin: 22px 0 0; font: 600 76px/1.04 var(--serif); letter-spacing: -.05em; color: #f5f5ec; text-wrap: balance; }
    h1 span { display: block; color: #b9c79d; }
    .foot { display: flex; justify-content: space-between; align-items: center; gap: 32px; margin-top: auto; padding-top: 26px; border-top: 1px solid #535b4c; font: 500 21px/1.3 var(--sans); color: #c1c7b9; }
    .foot strong { font-weight: 600; color: #f5f5ec; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand"><span class="mark" aria-hidden="true"></span><span>Intervencija</span></div>
    <p class="eyebrow" id="eyebrow"></p>
    <h1><span id="title" style="display:inline;color:inherit"></span><span id="accent"></span></h1>
    <div class="foot"><span id="foot"></span><strong>intervencija.eu</strong></div>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    for (const id of ['eyebrow', 'title', 'accent', 'foot']) {
      document.getElementById(id).textContent = params.get(id) || '';
    }
  </script>
</body>
</html>
